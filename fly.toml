app = "live-audio-server"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 5000
    soft_limit = 3500

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
